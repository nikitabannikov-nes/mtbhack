spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:mtb_game}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:mtb}
    password: ${DB_PASSWORD:mtb}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:changeme-use-a-long-random-string-in-production}
  expiration-ms: 900000        # 15 min
  refresh-expiration-ms: 604800000  # 7 days

app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000}

  game:
    board-size: 25
    item-delete-energy-refund: 0.5

  rarity-probabilities:
    DEFAULT: 95.99
    COMMON: 3.0
    RARE: 1.0
    EPIC: 0.5
    LEGENDARY: 0.01

  mock:
    daily-event-cap: 5   # max mock events of same type per user per day

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
