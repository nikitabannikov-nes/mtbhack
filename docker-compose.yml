services:
  mysql:
    image: mysql:8.0
    container_name: mtb-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mtb_game
      MYSQL_USER: mtb
      MYSQL_PASSWORD: mtb
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "mtb", "-pmtb"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mtb-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: mtb_game
      DB_USER: mtb
      DB_PASSWORD: mtb
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-in-prod}
      CORS_ORIGINS: http://172.20.10.5:3000,http://172.20.10.5:3001
      SPRING_PROFILES_ACTIVE: dev
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mtb-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://172.20.10.5:8080
    ports:
      - "3001:3000"

volumes:
  mysql_data:
